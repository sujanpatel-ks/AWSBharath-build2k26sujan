[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
markers =
    unit: Unit tests (no AWS calls)
    integration: Integration tests (requires deployed stack)
    safety: Safety validation tests
    rag: RAG / evidence retrieval tests
    auth: Authentication / authorization tests
env =
    AWS_DEFAULT_REGION=ap-south-1
    DYNAMODB_TABLE=AgroCare-Main-test
    S3_IMAGES_BUCKET=agrocare-test-bucket
    HAIKU_MODEL_ID=global.anthropic.claude-haiku-4-5-20251001-v1:0
    SONNET_MODEL_ID=anthropic.claude-sonnet-4-6
    KNOWLEDGE_BASE_ID=test-kb-id
    COGNITO_USER_POOL_ID=ap-south-1_TESTPOOL
    COGNITO_APP_CLIENT_ID=testclientid
